<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Square Authorization</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  pre  { font-size: 16px; background: #f1f1f1; padding: 14px; border-radius: 6px; word-break: break-all; white-space: pre-wrap; }
  button { font-size: 16px; padding: 8px 18px; cursor: pointer; }
  .err { color: #b00020; }
  .ok  { color: #1b7f3b; }
</style>
</head>
<body>
<h2>Square authorization</h2>
<div id="out"></div>
<script>
  var p = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var code = p.get('code');
  if (code) {
    out.innerHTML =
      '<p class="ok">Authorization approved.</p>' +
      '<p>Copy this code into SquarePosSync (it expires in <b>5 minutes</b>):</p>' +
      '<pre id="c"></pre><button id="b">Copy code</button> <span id="m"></span>';
    document.getElementById('c').textContent = code;
    document.getElementById('b').onclick = function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById('m').textContent = 'Copied!';
      });
    };
  } else if (p.get('error')) {
    out.innerHTML = '<p class="err">Authorization was not completed:</p><pre id="e"></pre>';
    document.getElementById('e').textContent = p.get('error_description') || p.get('error');
  } else {
    out.innerHTML = '<p>This page receives the Square authorization code. Nothing to do here.</p>';
  }
</script>
</body>
</html>
